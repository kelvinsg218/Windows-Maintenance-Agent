[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-maintenance-agent"
dynamic = ["version"]
description = "Agente de manutenção preventiva para estações Windows 10/11 em ambientes corporativos de TI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Acesso à Windows Update Agent API (COM). Única dependência de runtime.
    "pywin32>=306; sys_platform == 'win32'",
]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6"]

[project.scripts]
maintenance = "maintenance.cli:main"

[tool.setuptools.dynamic]
version = { attr = "maintenance.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
known-first-party = ["maintenance", "tests"]

[tool.ruff.lint.per-file-ignores]
# Testes usam assert, arquivos temporários e subprocess controlados.
"tests/**" = ["S101", "S105", "S106", "S108", "S603"]
